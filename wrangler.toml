# Cloudflare Pages configuration for a full-stack project:
#   public/     static assets (build output directory)
#   functions/  Pages Functions served at /api/*
#   D1          database bound as `DB`
#
# Replace database_id with the value printed by:
#   npx wrangler d1 create ask-dr-martin-db

name = "ask-dr-martin"
pages_build_output_dir = "public"
compatibility_date = "2026-10-25"

[[d1_databases]]
binding = "DB"
database_name = "ask-dr-martin-db"
# Replace this placeholder with the id printed by `wrangler d1 create`.
# A UUID-shaped value is required, so local dev works before you create the database.
database_id = "00000000-0000-0000-0000-000000000000"
