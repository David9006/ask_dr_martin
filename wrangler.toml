# Cloudflare Pages configuration for a full-stack project:
#   public/     static assets (build output directory)
#   functions/  Pages Functions served at /api/*
#   D1          database bound as `DB`
#
# database_id comes from the output of:
#   npx wrangler d1 create ask-dr-martin-db
# After editing schema.sql, apply it to the deployed database with:
#   npm run db:init

name = "ask-dr-martin"
pages_build_output_dir = "public"
compatibility_date = "2026-10-25"

# Secrets must not live in this file. Set them with:
#   npx wrangler pages secret put SETTINGS_KEY --project-name ask-dr-martin
#   npx wrangler pages secret put RESEND_API_KEY --project-name ask-dr-martin
# For local `wrangler pages dev`, put them in .dev.vars (gitignored).

[vars]
# Sender for the sign-up verification email. The domain must be verified in
# Resend. `onboarding@resend.dev` only delivers to the Resend account owner.
MAIL_FROM = "Dr. Martin <onboarding@resend.dev>"

[[d1_databases]]
binding = "DB"
database_name = "ask-dr-martin-db"
database_id = "d8da52d6-2b7d-4565-83fa-c0d5fd5b1eb0"
